# typos (https://github.com/crate-ci/typos): words that are right as written.
[files]
# Hex test data, keys and generated vectors are not prose.
extend-exclude = ["spec/vectors/*", "*.lock", "LICENSE-*"]

[default.extend-words]
# Plan 9's network database format.
ndb = "ndb"
# Biba integrity model.
biba = "biba"
